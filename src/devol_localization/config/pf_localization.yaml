# Particle filter localization defaults. Override per experiment run.
pf_localization:
  ros__parameters:
    use_sim_time: true
    odom_topic: /devol_drive/odom
    map_topic: /devol_drive/projected_map
    scan_topic: /devol_drive/sensors/lidar2d_0/scan
    pose_topic: /devol_drive/pf_pose
    map_frame: map
    odom_frame: odom
    base_frame: a200_base_link
    # Off while spawn_entities.launch.py publishes a static map -> odom placeholder.
    publish_tf: false

    num_particles: 500          # study grid: 100, 500, 2000, 5000
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    sigma_hit: 0.2
    z_hit: 0.9
    z_rand: 0.1
    max_beams: 60
    likelihood_max_dist: 2.0
    resample_threshold: 0.5
    alpha_slow: 0.0             # augmented MCL injection; e.g. 0.001 / 0.1 for kidnapping runs
    alpha_fast: 0.0
    update_min_d: 0.05
    update_min_a: 0.05
    seed: -1                    # >= 0 for reproducible trials

    init_mode: tf               # tf | pose | global
    initial_std_xy: 0.25
    initial_std_yaw: 0.2
