# Builds the ROS 2 workspace on Lyrical and runs every package's tests (colcon build + colcon test).
# Headless: nothing here launches Gazebo. The MoveIt packages are skipped, as in the README and the
# Docker image, because Lyrical does not ship what they need.
# ament linter tests (ctest label `linter`, e.g. from ament_lint_common) are excluded: style is owned by
# the Format workflow (ruff, clang-format), and the ament linters disagree with it.
name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: lyrical
  SKIP_PACKAGES: devol devol_moveit_config devol_demo_py

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies with rosdep
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep
          (rosdep init 2>/dev/null || true)
          rosdep update --rosdistro "$ROS_DISTRO"
          paths=$(colcon list --base-paths src --packages-skip $SKIP_PACKAGES --paths-only)
          rosdep install --from-paths $paths --ignore-src -r -y --rosdistro "$ROS_DISTRO"

      - name: colcon build
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --base-paths src --packages-skip $SKIP_PACKAGES \
            --event-handlers console_cohesion+ --cmake-args -DBUILD_TESTING=ON

      - name: colcon test
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          source install/setup.bash
          colcon test --base-paths src --packages-skip $SKIP_PACKAGES \
            --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -LE linter

      - name: Test results
        if: always()
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon test-result --all --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*/pytest.xml
            build/*/test_results/
          if-no-files-found: ignore
